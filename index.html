<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171622" />
    <title>黑暗森林 · 经典地图</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="preview">
      <header>
        <h1>暮林石室</h1>
        <div class="controls">
          <button id="map-overview" type="button" hidden>全图</button>
          <button id="focus-self" type="button" hidden>近看自己</button>
          <button id="reset-view" type="button" disabled>重置视角</button>
          <button id="edges" type="button" aria-pressed="true" disabled>描边</button>
        </div>
      </header>
      <div class="stage">
        <canvas id="room" width="480" height="288" aria-label="青苔覆盖的石室和两只火盆。拖动画布或按方向键旋转视角。"></canvas>
        <p id="error" role="status" hidden></p>
      </div>
      <footer>
        <span>480 × 288 · 最近邻放大</span>
        <span>拖动旋转</span>
      </footer>
      <section id="game" aria-label="联机对局">
        <div class="game-status">
          <strong id="room-name"></strong><span id="seat" data-testid="seat">等待座位</span>
          <span id="round" data-testid="round">连接中</span>
      <p id="countdown" data-testid="countdown"></p>
          <span id="connection" role="status">正在连接房间</span>
        </div>
        <div class="game-status">
          <span id="board-summary" data-testid="board-summary"></span>
          <span id="position" data-testid="position"></span>
          <span id="result" data-testid="result"></span>
          <span id="confrontations" data-testid="confrontations"></span>
        </div>
        <p>依次选择方向添加移动，或添加等待拍，每轮最多两次移动、四拍。提交后锁定。双方锁定后统一结算。行号向南增加，列号向东增加。</p>
        <div class="plan-controls">
          <div class="directions" aria-label="移动方向">
            <button data-dr="-1" data-dc="-1" disabled>西北 ↖</button>
            <button data-dr="-1" data-dc="0" disabled>北 ↑</button>
            <button data-dr="-1" data-dc="1" disabled>东北 ↗</button>
            <button data-dr="0" data-dc="-1" disabled>西 ←</button>
            <button id="wait" disabled>等待</button>
            <button data-dr="0" data-dc="1" disabled>东 →</button>
            <button data-dr="1" data-dc="-1" disabled>西南 ↙</button>
            <button data-dr="1" data-dc="0" disabled>南 ↓</button>
            <button data-dr="1" data-dc="1" disabled>东南 ↘</button>
          </div>
          <div class="plan-summary">
            <label for="direction-origin">方向起点</label>
            <select id="direction-origin" disabled>
              <option value="planned">上一移动目标（默认）</option>
              <option value="current">本轮当前位置</option>
            </select>
            <span id="selection">待提交 · 等待</span>
            <span id="plan" data-testid="plan">草稿 · 等待</span>
            <div class="controls">
              <button id="clear-plan" disabled>清空重排</button>
              <button id="submit-plan" disabled>提交计划</button>
              <button id="lock-plan" disabled>锁定计划</button>
            </div>
          </div>
        </div>
        <p>亮格为当前视野，带地形和格边标记的灰格为探索记忆，空灰格为未知区域。橙色为自己，绿色为当前目标，空心标记为旧目击。格边石墙、木门和窗框随视野揭示。</p>
        <ul id="sightings" data-testid="sightings" aria-label="目击与地图记忆"></ul>
        <ol id="beat-results" data-testid="beat-results" aria-label="自己的上轮逐拍结果"></ol>
        <button id="replay" disabled>播放上轮</button>
        <span id="playback" data-testid="playback" role="status"></span>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
